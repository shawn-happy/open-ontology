<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4f"/>
      <stop offset="0.2" stop-color="#fa8c16"/>
      <stop offset="0.4" stop-color="#fadb14"/>
      <stop offset="0.6" stop-color="#52c41a"/>
      <stop offset="0.8" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#722ed1"/>
    </linearGradient>
    <linearGradient id="prismFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
