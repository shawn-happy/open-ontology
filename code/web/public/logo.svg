  <path d="M42 36 L62 36" stroke="url(#spectrum)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M40 42 L62 50" stroke="url(#spectrum)" stroke-width="4" stroke-linecap="round" fill="none"/>
