# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 多租户配置（独立前缀，避免与 MyBatis-Plus 自带的 mybatis-plus 前缀冲突）
prism:
  tenant:
    enabled: true
    column: workspace_code
    ignore-tables:
      - system_user
      - system_role
      - system_menu
      - system_dept
      - system_user_role
      - system_role_menu
      - system_user_dept
      - system_audit_log
      - system_login_log
      - system_exec_log

# JWT 配置（RS256，密钥文件位于 classpath:keys/）
jwt:
  access-expire-hours: 2
  refresh-expire-days: 7
  remember-refresh-expire-days: 30
