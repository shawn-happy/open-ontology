<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作空间 · Open Ontology</title>
<link rel="stylesheet" href="../assets/style.css" />
<style>
  /* ===== 空间卡片网格 ===== */
  .ws-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 16px; }
  .ws-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: .15s; }
  .ws-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--primary); }
  .ws-card.off { opacity: .55; }
  .ws-card-top { display: flex; align-items: center; justify-content: space-between; }
  .ws-card .ico { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--primary-light); color: var(--primary); }
  .ws-card .name { font-weight: 600; margin-top: 10px; }
  .ws-card .meta { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .ws-card .foot { display: flex; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  /* ===== 穿梭框：部门分组 ===== */
  .tp-group { font-size: 12px; font-weight: 600; color: var(--text-2); padding: 8px 8px 2px; }
  .tp-sub { margin-left: 14px; }
  .tp-item.dim { color: var(--text-3); cursor: default; }
</style>
</head>
<body>
<div id="root"></div>

<!-- 创建/编辑工作空间 -->
<div class="mask" id="wsModal" data-close-mask>
  <div class="modal">
    <div class="modal-h"><span id="wsModalTitle">创建工作空间</span><span class="x" onclick="App.closeModal('wsModal')">×</span></div>
    <div class="modal-b">
      <div class="form-item"><label><span class="req">*</span>空间名称</label><input type="text" id="wsName" placeholder="如：智能制造空间" /></div>
      <div class="form-item"><label><span class="req">*</span>空间编码</label><input type="text" id="wsCode" placeholder="如：smart-mfg（唯一标识）" /><div class="tip">创建后不可修改</div></div>
      <div class="form-item"><label>描述</label><textarea id="wsDesc" rows="3" placeholder="空间用途说明"></textarea></div>
      <div class="form-row">
        <div class="form-item">
          <label><span class="req">*</span>空间管理员</label>
          <select id="wsAdmin"><option>请选择</option><option>shawn（超级管理员）</option><option>张伟</option><option>李静</option><option>周杰</option></select>
          <div class="tip">仅超级管理员 / 空间管理员可创建工作空间</div>
        </div>
        <div class="form-item">
          <label>状态</label>
          <select id="wsStatus"><option>启用</option><option>停用</option></select>
        </div>
      </div>
    </div>
    <div class="modal-f">
      <button class="btn" onclick="App.closeModal('wsModal')">取消</button>
      <button class="btn btn-primary" onclick="wsSave()">确定</button>
    </div>
  </div>
</div>

<!-- 成员分配（用户 / 角色 / 部门） -->
<div class="mask" id="memberModal" data-close-mask>
  <div class="modal lg">
    <div class="modal-h">分配成员 · <span class="text-2" id="memberWsName">智能制造空间</span><span class="x" onclick="App.closeModal('memberModal')">×</span></div>
    <div class="modal-b">
      <div class="tabs" data-group="mem">
        <div class="tab active" data-pane="user" data-group="mem">用户 <span class="cnt" id="memUserCnt">0</span></div>
        <div class="tab" data-pane="role" data-group="mem">角色 <span class="cnt">5</span></div>
        <div class="tab" data-pane="dept" data-group="mem">部门 <span class="cnt" id="memDeptCnt">0</span></div>
      </div>

      <!-- 用户：按部门树分组的穿梭框 -->
      <div class="tab-pane active" data-group="mem" data-pane="user">
        <div class="transfer mt16">
          <div class="transfer-panel">
            <div class="tp-h"><input type="text" class="search" style="flex:1" placeholder="搜索部门 / 用户名 / 账号…" oninput="memberState.kw=this.value.trim();renderUserPool()" /><span class="text-3" id="poolCnt"></span></div>
            <div class="tp-list" id="userPoolList"></div>
          </div>
          <div class="transfer-mid">
            <button class="btn btn-sm btn-primary" onclick="memberAdd()">添加 ›</button>
            <button class="btn btn-sm" onclick="memberRemove()">‹ 移除</button>
          </div>
          <div class="transfer-panel">
            <div class="tp-h">已选用户（<span id="memberCnt">0</span>）</div>
            <div class="tp-list" id="memberList"></div>
          </div>
        </div>
      </div>

      <!-- 角色：预置空间角色清单 -->
      <div class="tab-pane" data-group="mem" data-pane="role">
        <div class="tip mt16 text-2">空间角色为平台预置（不可在此新增），在空间创建时自动初始化，成员可在用户 tab 添加后按需赋予角色。</div>
        <table class="table mt8">
          <tr><th>角色</th><th>编码</th></tr>
          <tbody id="spaceRoleTbody"></tbody>
        </table>
      </div>

      <!-- 部门：部门树穿梭框 -->
      <div class="tab-pane" data-group="mem" data-pane="dept">
        <div class="transfer mt16">
          <div class="transfer-panel">
            <div class="tp-h"><span>部门树（仅部门，不含用户）</span></div>
            <div class="tp-list" id="deptPoolList"></div>
          </div>
          <div class="transfer-mid">
            <button class="btn btn-sm btn-primary" onclick="deptAdd()">添加 ›</button>
            <button class="btn btn-sm" onclick="deptRemove()">‹ 移除</button>
          </div>
          <div class="transfer-panel">
            <div class="tp-h">已关联部门（<span id="deptCnt">0</span>）</div>
            <div class="tp-list" id="deptMemberList"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-f">
      <button class="btn" onclick="App.closeModal('memberModal')">关闭</button>
      <button class="btn btn-primary" onclick="App.closeModal('memberModal');toast('成员配置已保存')">保存</button>
    </div>
  </div>
</div>

<script src="../assets/app.js"></script>
<script>
// 模拟工作空间数据
const wsRows = [
  { name: '智能制造空间', code: 'smart-mfg', admin: '张伟', desc: '设备、工艺、物料、质量等本体建模与产线数据分析', members: 12, assets: 86, on: true, icon: '⚙' },
  { name: '供应链分析空间', code: 'supply-chain', admin: '李静', desc: '供应商、订单、物流全链路关联分析', members: 8, assets: 42, on: true, icon: '⛓' },
  { name: '设备运维空间', code: 'device-ops', admin: '周杰', desc: '设备台账、故障知识图谱与预测性维护', members: 6, assets: 31, on: true, icon: '🛠' },
  { name: '测试沙箱空间', code: 'sandbox', admin: 'shawn', desc: '功能验证与培训环境', members: 3, assets: 5, on: false, icon: '🧪' },
  { name: '质量追溯空间', code: 'quality-trace', admin: '吴娜', desc: '来料、制程、出货全流程质量追溯分析', members: 5, assets: 24, on: true, icon: '🔍' },
  { name: '能源管理空间', code: 'energy-mgmt', admin: '王强', desc: '能耗采集、能效指标与碳排放本体建模', members: 4, assets: 18, on: true, icon: '⚡' },
  { name: '研发协作空间', code: 'rd-collab', admin: '陈晨', desc: '研发项目、实验数据与知识沉淀', members: 7, assets: 36, on: true, icon: '💡' },
  { name: '物流仿真空间', code: 'logis-sim', admin: '孙丽', desc: '仓储布局、运输路径与配送时效仿真', members: 2, assets: 9, on: false, icon: '🚚' },
];

// 查询状态：模糊关键字 + 状态过滤 + 分页
const wsState = { kw: '', status: '全部', page: 1, pageSize: 8 };
let editingCode = null; // null = 新建，否则为正在编辑的空间编码

function wsFiltered() {
  return wsRows.filter((r) =>
    (wsState.status === '全部' || (r.on ? '启用' : '停用') === wsState.status) &&
    (!wsState.kw || r.name.includes(wsState.kw) || r.code.includes(wsState.kw) || (r.desc || '').includes(wsState.kw))
  );
}

function wsRender() {
  const list = wsFiltered();
  const pages = Math.max(1, Math.ceil(list.length / wsState.pageSize));
  if (wsState.page > pages) wsState.page = pages;
  const rows = list.slice((wsState.page - 1) * wsState.pageSize, wsState.page * wsState.pageSize);
  document.getElementById('wsCardWrap').innerHTML = `
    <div class="ws-grid">
      ${rows.length ? rows.map((r) => `
      <div class="ws-card ${r.on ? '' : 'off'}" onclick="App.enterWs('${r.name}')" title="点击进入空间">
        <div class="ws-card-top">
          <span class="ico">${r.icon}</span>
          <span class="switch ${r.on ? 'on' : ''}" title="${r.on ? '启用中，点击停用' : '已停用，点击启用'}" onclick="event.stopPropagation();wsToggle('${r.code}')"></span>
        </div>
        <div class="name">${r.name}</div>
        <div class="meta">◆ 本体资产 ${r.assets} 项${r.on ? '' : ' · 已停用'}</div>
        <div class="foot">
          <button class="btn-link btn-sm" onclick="event.stopPropagation();wsOpenEdit('${r.code}')">编辑</button>
          <button class="btn-link btn-sm" onclick="event.stopPropagation();wsOpenMember('${r.name}')">分配成员</button>
        </div>
      </div>`).join('') : '<div class="empty" style="grid-column:1/-1;">未找到匹配的工作空间</div>'}
    </div>
    <div class="pager">共 ${list.length} 个空间<span style="flex:1"></span>
      <span class="pg ${wsState.page === 1 ? 'dis' : ''}" onclick="wsGo(${wsState.page - 1})">‹</span>
      ${Array.from({ length: pages }, (_, i) =>
        `<span class="pg ${wsState.page === i + 1 ? 'cur' : ''}" onclick="wsGo(${i + 1})">${i + 1}</span>`).join('')}
      <span class="pg ${wsState.page === pages ? 'dis' : ''}" onclick="wsGo(${wsState.page + 1})">›</span>
    </div>`;
}

function wsGo(p) {
  const pages = Math.max(1, Math.ceil(wsFiltered().length / wsState.pageSize));
  if (p < 1 || p > pages) return;
  wsState.page = p;
  wsRender();
}

function wsOpenCreate() {
  editingCode = null;
  document.getElementById('wsModalTitle').textContent = '创建工作空间';
  ['wsName', 'wsCode', 'wsDesc'].forEach((id) => (document.getElementById(id).value = ''));
  document.getElementById('wsCode').disabled = false;
  document.getElementById('wsAdmin').selectedIndex = 0;
  document.getElementById('wsStatus').selectedIndex = 0;
  App.openModal('wsModal');
}

function wsOpenEdit(code) {
  const r = wsRows.find((x) => x.code === code);
  if (!r) return;
  editingCode = code;
  document.getElementById('wsModalTitle').textContent = '编辑工作空间';
  document.getElementById('wsName').value = r.name;
  document.getElementById('wsCode').value = r.code;
  document.getElementById('wsCode').disabled = true;
  document.getElementById('wsDesc').value = r.desc;
  document.getElementById('wsAdmin').value = r.admin === 'shawn' ? 'shawn（超级管理员）' : r.admin;
  document.getElementById('wsStatus').value = r.on ? '启用' : '停用';
  App.openModal('wsModal');
}

function wsSave() {
  const name = document.getElementById('wsName').value.trim();
  const code = document.getElementById('wsCode').value.trim();
  const desc = document.getElementById('wsDesc').value.trim();
  const admin = document.getElementById('wsAdmin').value;
  const on = document.getElementById('wsStatus').value === '启用';
  if (!name || !code || admin === '请选择') { toast('请填写空间名称 / 编码 / 管理员'); return; }
  if (editingCode) {
    const r = wsRows.find((x) => x.code === editingCode);
    Object.assign(r, { name, desc, admin: admin === 'shawn（超级管理员）' ? 'shawn' : admin, on });
    toast('工作空间已更新（原型演示）');
  } else {
    if (wsRows.some((x) => x.code === code)) { toast('空间编码已存在'); return; }
    wsRows.push({ name, code, admin: admin === 'shawn（超级管理员）' ? 'shawn' : admin, desc, members: 0, assets: 0, on, icon: '▦' });
    toast('工作空间已创建（原型演示）');
  }
  App.closeModal('wsModal');
  wsState.page = 1;
  wsRender();
}

function wsToggle(code) {
  const r = wsRows.find((x) => x.code === code);
  r.on = !r.on;
  toast(`空间「${r.name}」已${r.on ? '启用' : '停用'}`);
  wsRender();
}

// ===== 成员分配 =====
// 用户池（含部门，用于按部门树分组展示）
const USER_POOL = [
  { name: '张伟', account: 'zhangwei', dept: '智能制造事业部', title: '空间管理员' },
  { name: '李静', account: 'lijing', dept: '数据平台部', title: '本体建模员' },
  { name: '周杰', account: 'zhoujie', dept: '供应链中心', title: '数据工程师' },
  { name: '吴娜', account: 'wuna', dept: '智能制造事业部', title: '数据分析师' },
  { name: '王强', account: 'wangqiang', dept: '数据平台部', title: '数据工程师' },
  { name: '赵敏', account: 'zhaomin', dept: '工艺数字化组', title: '工艺专家' },
  { name: '孙立', account: 'sunli', dept: 'IT 基础设施部', title: '平台运维' },
  { name: '刘洋', account: 'liuyang', dept: '质量分析组', title: '质量工程师' },
  { name: '陈晨', account: 'chenchen', dept: '数据平台部', title: '数据工程师' },
  { name: '孙丽', account: 'sunli2', dept: '供应链中心', title: '业务专家' },
  { name: '杨帆', account: 'yangfan', dept: '智能制造事业部', title: '算法工程师' },
  { name: '郑洁', account: 'zhengjie', dept: '供应链中心', title: '计划员' },
];
const WS_DEPTS = [
  { name: '数据平台部', children: [] },
  { name: '智能制造事业部', children: [{ name: '工艺数字化组' }, { name: '质量分析组' }] },
  { name: '供应链中心', children: [] },
  { name: 'IT 基础设施部', children: [] },
];
// 各空间的初始成员 / 已关联部门（模拟）
const WS_MEMBERS = {
  '智能制造空间': ['张伟', '李静', '周杰', '吴娜', '杨帆', '赵敏'],
  '供应链分析空间': ['李静', '周杰', '孙丽', '郑洁'],
  '设备运维空间': ['周杰', '王强', '刘洋'],
  '测试沙箱空间': [],
  '质量追溯空间': ['吴娜', '刘洋', '陈晨'],
  '能源管理空间': ['王强', '陈晨'],
  '研发协作空间': ['杨帆', '陈晨'],
  '物流仿真空间': ['孙丽'],
};
const WS_DEPT_MEMBERS = {
  '智能制造空间': ['智能制造事业部', '工艺数字化组'],
  '供应链分析空间': ['供应链中心'],
  '质量追溯空间': ['质量分析组'],
};

// 预置空间角色（不可新增，空间创建时自动初始化）
const SPACE_ROLES = [
  { name: '空间管理员', code: 'ws_admin' },
  { name: '本体建模员', code: 'ont_modeler'},
  { name: '数据工程师', code: 'data_eng'},
  { name: '安全审计员', code: 'sec_auditor'},
  { name: '只读访客', code: 'viewer'},
];

// 成员弹窗状态：当前空间 / 搜索关键字 / 已选成员与部门 / 穿梭框勾选集合
let memberState = null;

function wsOpenMember(name) {
  memberState = { ws: name, kw: '', members: [...(WS_MEMBERS[name] || ['张伟'])], deptMembers: [...(WS_DEPT_MEMBERS[name] || [])], sel: { left: new Set(), right: new Set(), dept: new Set(), deptR: new Set() } };
  document.getElementById('memberWsName').textContent = name;
  renderUserPool(); renderMemberList(); renderDeptPool(); renderDeptMemberList(); renderSpaceRoles();
  App.openModal('memberModal');
}

function memberSel(setName, key, checked) {
  const s = memberState.sel[setName];
  checked ? s.add(key) : s.delete(key);
}

// 用户 tab：按部门树分组展示用户池
function renderUserPool() {
  const kw = memberState.kw;
  const inSpace = new Set(memberState.members);
  let total = 0, html = '';
  const renderDept = (deptName, isSub) => {
    const all = USER_POOL.filter((u) => u.dept === deptName);
    const userHit = all.filter((u) => !kw || u.name.includes(kw) || u.account.includes(kw));
    const deptHit = kw && deptName.includes(kw);
    const showUsers = deptHit ? all : userHit;
    if (kw && !deptHit && !userHit.length) return;
    total += showUsers.length;
    html += `<div class="tp-group ${isSub ? 'tp-sub' : ''}">${deptName}（${showUsers.length}）</div>`;
    html += showUsers.map((u) => inSpace.has(u.account)
      ? `<div class="tp-item dim">✓ ${u.name} · ${u.title} <span class="text-3">已在空间</span></div>`
      : `<label class="tp-item"><input type="checkbox" onchange="memberSel('left','${u.account}',this.checked)" /> ${u.name} · ${u.title}</label>`).join('');
  };
  WS_DEPTS.forEach((d) => { renderDept(d.name, false); (d.children || []).forEach((c) => renderDept(c.name, true)); });
  if (kw && !total) html = '<div class="empty">未找到匹配的用户</div>';
  document.getElementById('userPoolList').innerHTML = html;
  document.getElementById('poolCnt').textContent = total;
}

function renderMemberList() {
  document.getElementById('memberCnt').textContent = memberState.members.length;
  document.getElementById('memUserCnt').textContent = memberState.members.length;
  document.getElementById('memberList').innerHTML = memberState.members.length
    ? memberState.members.map((a) => {
        const u = USER_POOL.find((x) => x.account === a) || { name: a, title: '' };
        return `<label class="tp-item"><input type="checkbox" onchange="memberSel('right','${a}',this.checked)" /> ${u.name} · ${u.title}</label>`;
      }).join('')
    : '<div class="empty">暂无成员，请从左侧添加</div>';
}

function memberAdd() {
  const s = memberState.sel.left;
  if (!s.size) { toast('请先在左侧勾选要添加的用户'); return; }
  s.forEach((a) => { if (!memberState.members.includes(a)) memberState.members.push(a); });
  s.clear(); renderUserPool(); renderMemberList();
  toast('已添加所选用户（原型演示）');
}

function memberRemove() {
  const s = memberState.sel.right;
  if (!s.size) { toast('请先在右侧勾选要移除的用户'); return; }
  memberState.members = memberState.members.filter((a) => !s.has(a));
  s.clear(); renderUserPool(); renderMemberList();
  toast('已移除所选用户（原型演示）');
}

// 角色 tab：预置空间角色清单（无成员数列，无新增入口）
function renderSpaceRoles() {
  document.getElementById('spaceRoleTbody').innerHTML = SPACE_ROLES.map((r) => `
    <tr>
      <td><b>${r.name}</b></td><td class="mono">${r.code}</td>
    </tr>`).join('');
}

// 部门 tab：部门树穿梭框（仅部门）
function renderDeptPool() {
  const linked = new Set(memberState.deptMembers);
  let html = '';
  const walk = (d, isSub) => {
    html += linked.has(d.name)
      ? `<div class="tp-item dim ${isSub ? 'tp-sub' : ''}">✓ ${d.name} <span class="text-3">已关联</span></div>`
      : `<label class="tp-item ${isSub ? 'tp-sub' : ''}"><input type="checkbox" onchange="memberSel('dept','${d.name}',this.checked)" /> ${d.name}</label>`;
    (d.children || []).forEach((c) => walk(c, true));
  };
  WS_DEPTS.forEach((d) => walk(d, false));
  document.getElementById('deptPoolList').innerHTML = html;
}

function renderDeptMemberList() {
  document.getElementById('deptCnt').textContent = memberState.deptMembers.length;
  document.getElementById('memDeptCnt').textContent = memberState.deptMembers.length;
  document.getElementById('deptMemberList').innerHTML = memberState.deptMembers.length
    ? memberState.deptMembers.map((d) => `<label class="tp-item"><input type="checkbox" onchange="memberSel('deptR','${d}',this.checked)" /> ${d}</label>`).join('')
    : '<div class="empty">暂无关联部门</div>';
}

function deptAdd() {
  const s = memberState.sel.dept;
  if (!s.size) { toast('请先在左侧勾选要关联的部门'); return; }
  s.forEach((d) => { if (!memberState.deptMembers.includes(d)) memberState.deptMembers.push(d); });
  s.clear(); renderDeptPool(); renderDeptMemberList();
  toast('已关联所选部门（原型演示）');
}

function deptRemove() {
  const s = memberState.sel.deptR;
  if (!s.size) { toast('请先在右侧勾选要移除的部门'); return; }
  memberState.deptMembers = memberState.deptMembers.filter((d) => !s.has(d));
  s.clear(); renderDeptPool(); renderDeptMemberList();
  toast('已移除所选部门（原型演示）');
}

App.mount({
  page: 'workspace',
  crumbs: ['平台管理', '工作空间'],
  title: '工作空间',
  desc: '工作空间是本体资产、数据、应用与安全策略的顶层隔离单元。点击卡片进入空间，支持创建、编辑、启停用与成员分配。',
  actions: `<button class="btn btn-primary" onclick="wsOpenCreate()">+ 创建工作空间</button>`,
  content: `
  <div class="stat-grid">
    <div class="stat"><div class="label">工作空间总数</div><div class="val" id="wsTotalStat">8</div><div class="delta up">▲ 较上月 +2</div></div>
    <div class="stat"><div class="label">空间成员总数</div><div class="val">47</div><div class="delta up">▲ +5</div></div>
    <div class="stat"><div class="label">本体资产总数</div><div class="val">251</div><div class="delta up">▲ +12</div></div>
    <div class="stat"><div class="label">活跃空间（30天）</div><div class="val">6 / 8</div><div class="delta down">▼ 2 个空间停用</div></div>
  </div>
  <div class="card">
    <div class="card-h">
      <h3>空间列表</h3>
      <input class="search" type="text" placeholder="模糊搜索：名称 / 编码 / 描述…"
        oninput="wsState.kw=this.value.trim(); wsState.page=1; wsRender()" />
      <div class="right">
        <select onchange="wsState.status=this.value; wsState.page=1; wsRender()">
          <option>全部状态</option><option>启用</option><option>停用</option>
        </select>
      </div>
    </div>
    <div id="wsCardWrap"></div>
  </div>`,
  onMount() {
    wsRender();
  },
});
</script>
</body>
</html>
