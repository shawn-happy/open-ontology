<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>系统管理 · Open Ontology</title>
<link rel="stylesheet" href="../assets/style.css" />
<style>
  .user-link { color: var(--primary); cursor: pointer; text-decoration: none; }
  .user-link:hover { text-decoration: underline; }
  .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check-grid label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .radio-col { display: flex; flex-direction: column; gap: 8px; }
  .radio-col label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .perm-tree label { display: flex; align-items: center; gap: 6px; padding: 3px 4px; font-size: 13px; cursor: pointer; }
  .perm-tree .pt-children { margin-left: 22px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- 新增/编辑用户 -->
<div class="mask" id="userModal" data-close-mask>
  <div class="modal">
    <div class="modal-h"><span id="userModalTitle">新增用户</span><span class="x" onclick="App.closeModal('userModal')">×</span></div>
    <div class="modal-b">
      <div class="form-row">
        <div class="form-item"><label><span class="req">*</span>姓名</label><input type="text" id="uName" placeholder="如：王强" /></div>
        <div class="form-item"><label><span class="req">*</span>账号</label><input type="text" id="uAccount" placeholder="如：wangqiang" /></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label><span class="req">*</span>手机号</label><input type="text" id="uPhone" placeholder="如：138 0000 0000" /></div>
        <div class="form-item"><label><span class="req">*</span>性别</label><select id="uGender"><option>男</option><option>女</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label><span class="req">*</span>所属部门</label><select id="uDept"><option>数据平台部</option><option>智能制造事业部</option><option>工艺数字化组</option><option>质量分析组</option><option>供应链中心</option><option>IT 基础设施部</option></select></div>
        <div class="form-item"><label>全局角色</label><select id="uRole"><option>普通用户</option><option>系统运维</option><option>空间管理员</option></select></div>
      </div>
      <div class="form-item"><label>邮箱</label><input type="text" id="uEmail" placeholder="name@company.com" /></div>
      <div class="tip">初始密码由后端统一配置（配置文件下发），不在此展示；用户首次登录需修改密码。</div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('userModal')">取消</button><button class="btn btn-primary" onclick="userSave()">确定</button></div>
  </div>
</div>

<!-- 查看用户 -->
<div class="mask" id="userViewModal" data-close-mask>
  <div class="modal">
    <div class="modal-h">用户详情<span class="x" onclick="App.closeModal('userViewModal')">×</span></div>
    <div class="modal-b">
      <dl class="desc-list">
        <dt>姓名</dt><dd id="vName"></dd>
        <dt>账号</dt><dd class="mono" id="vAccount"></dd>
        <dt>手机号</dt><dd class="mono" id="vPhone"></dd>
        <dt>性别</dt><dd id="vGender"></dd>
        <dt>所属部门</dt><dd id="vDept"></dd>
        <dt>全局角色</dt><dd id="vRole"></dd>
        <dt>邮箱</dt><dd class="mono" id="vEmail"></dd>
        <dt>状态</dt><dd id="vStatus"></dd>
        <dt>最近登录</dt><dd id="vLast"></dd>
      </dl>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('userViewModal')">关闭</button><button class="btn btn-primary" onclick="App.closeModal('userViewModal');userEdit(viewIndex)">编辑</button></div>
  </div>
</div>

<!-- 分配角色 -->
<div class="mask" id="userRoleModal" data-close-mask>
  <div class="modal">
    <div class="modal-h">分配角色 · <span id="userRoleName"></span><span class="x" onclick="App.closeModal('userRoleModal')">×</span></div>
    <div class="modal-b">
      <div class="tip mb16 text-2">勾选该用户拥有的全局角色；空间角色请在各工作空间内单独分配。</div>
      <div class="check-grid">
        <label><input type="checkbox" class="role-cb" value="超级管理员" /> 超级管理员</label>
        <label><input type="checkbox" class="role-cb" value="系统运维" /> 系统运维</label>
        <label><input type="checkbox" class="role-cb" value="空间管理员" /> 空间管理员</label>
        <label><input type="checkbox" class="role-cb" value="本体建模员" /> 本体建模员</label>
        <label><input type="checkbox" class="role-cb" value="数据工程师" /> 数据工程师</label>
        <label><input type="checkbox" class="role-cb" value="只读访客" /> 只读访客</label>
      </div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('userRoleModal')">取消</button><button class="btn btn-primary" onclick="App.closeModal('userRoleModal');toast('角色分配已保存（原型演示）')">确定</button></div>
  </div>
</div>

<!-- 新增/编辑角色 -->
<div class="mask" id="roleModal" data-close-mask>
  <div class="modal">
    <div class="modal-h"><span id="roleModalTitle">新增角色</span><span class="x" onclick="App.closeModal('roleModal')">×</span></div>
    <div class="modal-b">
      <div class="form-item"><label><span class="req">*</span>角色名称</label><input type="text" id="rName" placeholder="如：本体建模员" /></div>
      <div class="form-item"><label><span class="req">*</span>角色编码</label><input type="text" id="rCode" placeholder="如：ont_modeler" /></div>
      <div class="form-item"><label>角色类型</label><select id="rType"><option>全局角色</option><option>空间角色（在各空间内独立分配）</option></select></div>
      <div class="form-item"><label>备注</label><textarea id="rRemark" rows="2"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('roleModal')">取消</button><button class="btn btn-primary" onclick="roleSave()">确定</button></div>
  </div>
</div>

<!-- 角色配置权限（菜单权限 + 空间权限） -->
<div class="mask" id="rolePermModal" data-close-mask>
  <div class="modal">
    <div class="modal-h">配置权限 · <span id="permRoleName"></span><span class="x" onclick="App.closeModal('rolePermModal')">×</span></div>
    <div class="modal-b">
      <h4 style="margin:0 0 8px;">菜单权限</h4>
      <div class="perm-tree" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;max-height:220px;overflow:auto;">
        <label><input type="checkbox" checked /> <b>平台管理（全部）</b></label>
        <div class="pt-children">
          <label><input type="checkbox" checked /> 工作空间管理</label>
          <label><input type="checkbox" checked /> 系统管理</label>
          <div class="pt-children">
            <label><input type="checkbox" checked /> 用户管理</label>
            <label><input type="checkbox" checked /> 角色管理</label>
            <label><input type="checkbox" checked /> 权限管理</label>
            <label><input type="checkbox" checked /> 部门管理</label>
          </div>
          <label><input type="checkbox" checked /> 本体图谱</label>
          <label><input type="checkbox" /> 数据管理</label>
          <label><input type="checkbox" /> 安全管理</label>
          <label><input type="checkbox" /> 应用管理</label>
          <label><input type="checkbox" /> 审计管理</label>
        </div>
      </div>
      <h4 style="margin:16px 0 8px;">空间权限 <span class="text-3 fs12">（决定该角色可见的空间范围）</span></h4>
      <div class="radio-col">
        <label><input type="radio" name="wsScope" value="ALL_SUB" /> 可查看所有子部门的空间（父部门可见子部门全部空间）</label>
        <label><input type="radio" name="wsScope" value="DEPT_ONLY" checked /> 仅可查看自己部门的空间</label>
        <label><input type="radio" name="wsScope" value="OWN_ONLY" /> 仅可查看自己创建的空间</label>
      </div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('rolePermModal')">取消</button><button class="btn btn-primary" onclick="rolePermSave()">确定</button></div>
  </div>
</div>

<!-- 角色分配用户 -->
<div class="mask" id="roleUserModal" data-close-mask>
  <div class="modal">
    <div class="modal-h">分配用户 · <span id="roleUserName"></span><span class="x" onclick="App.closeModal('roleUserModal')">×</span></div>
    <div class="modal-b">
      <div class="tip mb16 text-2">勾选拥有该角色的用户；全局角色对全部空间生效，空间角色仅在其所属空间内生效。</div>
      <div class="check-grid" id="roleUserList"></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('roleUserModal')">取消</button><button class="btn btn-primary" onclick="App.closeModal('roleUserModal');toast('用户分配已保存（原型演示）')">确定</button></div>
  </div>
</div>

<!-- 新增/编辑部门 -->
<div class="mask" id="deptModal" data-close-mask>
  <div class="modal">
    <div class="modal-h"><span id="deptModalTitle">新增部门</span><span class="x" onclick="App.closeModal('deptModal')">×</span></div>
    <div class="modal-b">
      <div class="form-row">
        <div class="form-item"><label><span class="req">*</span>部门名称</label><input type="text" id="dName" placeholder="如：质量分析组" /></div>
        <div class="form-item"><label><span class="req">*</span>部门编码</label><input type="text" id="dCode" placeholder="如：quality-analysis" /></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>上级部门</label><select id="dParent"></select></div>
        <div class="form-item"><label>部门主管</label><select id="dLeader"><option>shawn</option><option>zhangwei</option><option>lijing</option><option>wuna</option></select></div>
      </div>
      <div class="form-item"><label>排序</label><input type="number" id="dSort" value="1" /></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('deptModal')">取消</button><button class="btn btn-primary" onclick="deptSave()">确定</button></div>
  </div>
</div>

<!-- 新增目录/菜单/按钮 -->
<div class="mask" id="menuModal" data-close-mask>
  <div class="modal">
    <div class="modal-h"><span id="menuModalTitle">新增权限节点</span><span class="x" onclick="App.closeModal('menuModal')">×</span></div>
    <div class="modal-b">
      <div class="form-row">
        <div class="form-item"><label><span class="req">*</span>名称</label><input type="text" id="mName" placeholder="如：导出本体定义" /></div>
        <div class="form-item"><label><span class="req">*</span>类型</label><select id="mType"><option>目录</option><option>菜单</option><option>按钮</option></select></div>
      </div>
      <div class="form-item"><label>上级节点</label><select id="mParent"></select></div>
      <div class="form-item"><label>权限标识</label><input type="text" id="mAuth" placeholder="如：ontology:export" /><div class="tip">参考 RuoYi：目录/菜单用于路由与侧边栏展示，按钮用于接口鉴权；目录节点可留空。</div></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('menuModal')">取消</button><button class="btn btn-primary" onclick="menuSave()">确定</button></div>
  </div>
</div>

<script src="../assets/app.js"></script>

// ===== 部门管理（部门 tab）=====

function findDept(node, name) {
  if (node.name === name) return node;
  for (const c of node.children || []) { const r = findDept(c, name); if (r) return r; }
  return null;
}

function findParent(node, name) {
  for (const c of node.children || []) {
    if (c.name === name) return node;
    const r = findParent(c, name);
    if (r) return r;
  }
  return null;
}

function deptDescendants(node) {
  const names = [node.name];
  (node.children || []).forEach((c) => names.push(...deptDescendants(c)));
  return names;
}

function renderDeptTree() {
  const el = document.getElementById('deptTree');
  el.innerHTML = '';
  renderTree(el, DEPT_TREE, (n) => renderDeptDetail(n));
}

function renderDeptDetail(name) {
  curDeptName = name;
  const node = findDept(DEPT_TREE, name);
  if (!node) return;
  const parent = findParent(DEPT_TREE, name);
  document.getElementById('deptName').textContent = name;
  document.getElementById('deptCode').textContent = node.code || '—';
  document.getElementById('deptLeader').textContent = node.leader || '—';
  document.getElementById('deptSort').textContent = node.sort != null ? node.sort : '—';
  document.getElementById('deptCount').textContent = USERS.filter((u) => deptDescendants(node).includes(u.dept)).length + ' 人（含子部门）';
  document.getElementById('deptSpaces').innerHTML = (DEPT_SPACES[name] || []).map((s) => `<span class="tag blue">${s}</span>`).join(' ') || '<span class="text-3">—</span>';
  document.getElementById('deptStatusBadge').innerHTML = node.on ? '<span class="badge b-green">启用</span>' : '<span class="badge b-gray">停用</span>';
  const sw = document.getElementById('deptStatusSwitch');
  const tip = document.getElementById('deptDisableTip');
  if (!parent) { sw.style.display = 'none'; tip.style.display = 'none'; } // 集团根节点不可停用
  else { sw.style.display = ''; tip.style.display = node.on ? '' : 'none'; sw.classList.toggle('on', !!node.on); }
  const members = USERS.filter((u) => u.dept === name);
  document.getElementById('deptMemberTbody').innerHTML = members.length
    ? members.map((u) => `
      <tr><td>${u.name}</td><td class="mono">${u.account}</td><td>${u.role}</td>
      <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('已移出部门（原型演示）')">移出部门</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="text-2" style="text-align:center;padding:14px 0;">该部门暂无直属成员</td></tr>';
}

function fillDeptParentOptions(selected) {
  const sel = document.getElementById('dParent');
  sel.innerHTML = deptDescendants(DEPT_TREE).map((n) => `<option>${n}</option>`).join('');
  if (selected) sel.value = selected;
}

function deptOpenCreate(parentName) {
  deptEditName = null;
  document.getElementById('deptModalTitle').textContent = '新增部门';
  document.getElementById('dName').value = '';
  document.getElementById('dCode').value = '';
  document.getElementById('dSort').value = 1;
  fillDeptParentOptions(parentName || 'XX 集团');
  App.openModal('deptModal');
}

function deptOpenEdit(name) {
  const node = findDept(DEPT_TREE, name);
  if (!node) return;
  deptEditName = name;
  document.getElementById('deptModalTitle').textContent = '编辑部门 · ' + name;
  document.getElementById('dName').value = name;
  document.getElementById('dCode').value = node.code || '';
  document.getElementById('dSort').value = node.sort != null ? node.sort : 1;
  const parent = findParent(DEPT_TREE, name);
  fillDeptParentOptions(parent ? parent.name : 'XX 集团');
  App.openModal('deptModal');
}

function deptSave() {
  const name = val('dName').trim(), code = val('dCode').trim();
  if (!name || !code) { toast('请填写部门名称与编码'); return; }
  if (name !== deptEditName && findDept(DEPT_TREE, name)) { toast('部门名称已存在'); return; }
  if (deptEditName) {
    const node = findDept(DEPT_TREE, deptEditName);
    Object.assign(node, { name, code, leader: val('dLeader'), sort: Number(val('dSort')) || 1 });
    toast('部门已更新（原型演示）');
  } else {
    const parent = findDept(DEPT_TREE, val('dParent'));
    if (!parent.children) parent.children = [];
    parent.children.push({ name, code, leader: val('dLeader'), sort: Number(val('dSort')) || 1, on: true });
    DEPT_SPACES[name] = [];
    toast('部门已创建（原型演示）');
  }
  App.closeModal('deptModal');
  renderDeptTree();
  const show = deptEditName ? name : curDeptName;
  renderDeptDetail(findDept(DEPT_TREE, show) ? show : '数据平台部');
}

function deptToggle() {
  const node = findDept(DEPT_TREE, curDeptName);
  if (!node) return;
  if (!node.on) { node.on = true; toast('部门「' + node.name + '」已启用'); renderDeptDetail(curDeptName); return; }
  const parent = findParent(DEPT_TREE, curDeptName);
  if (!parent) { toast('集团根节点不可停用'); return; }
  const movers = USERS.filter((u) => deptDescendants(node).includes(u.dept));
  const ok = confirm(`确认停用「${node.name}」？\n该部门及其子部门下的 ${movers.length} 名用户将迁移至上级部门「${parent.name}」。`);
  if (!ok) return;
  movers.forEach((u) => (u.dept = parent.name));
  node.on = false;
  renderDeptDetail(curDeptName);
  renderUsers();
  toast(`部门已停用，${movers.length} 名用户（含子部门）已迁移至「${parent.name}」`);
}

// ===== 权限管理（权限 tab，目录 / 菜单 / 按钮）=====

function buildPermIndex() {
  PERM_INDEX = {};
  (function walk(n) { PERM_INDEX[n.name] = n; (n.children || []).forEach(walk); })(PERM_DATA);
}

function renderPermTree() {
  const el = document.getElementById('permTree');
  el.innerHTML = '';
  renderTree(el, PERM_DATA, (n) => renderPermDetail(PERM_INDEX[n.name]));
}

function renderPermDetail(node) {
  if (!node) return;
  curPermName = node.name;
  const badge = `<span class="badge ${node.type === '目录' ? 'b-purple' : node.type === '菜单' ? 'b-blue' : 'b-cyan'}">${node.type}</span>`;
  document.getElementById('permName').textContent = node.name;
  document.getElementById('permTypeBadge').innerHTML = badge;
  document.getElementById('permType').innerHTML = badge;
  document.getElementById('permAuth').textContent = node.auth || '—';
  const kids = node.children || [];
  const tb = document.getElementById('permChildTbody');
  if (!kids.length) {
    tb.innerHTML = '<tr><td colspan="4" class="text-2" style="text-align:center;padding:18px 0;">暂无下级节点</td></tr>';
    return;
  }
  tb.innerHTML = kids.map((k) => `
    <tr>
      <td><b>${k.name}</b></td>
      <td><span class="badge ${k.type === '目录' ? 'b-purple' : k.type === '菜单' ? 'b-blue' : 'b-cyan'}">${k.type}</span></td>
      <td class="mono">${k.auth || '—'}</td>
      <td><span class="switch ${k.on === false ? '' : 'on'}" onclick="permChildToggle('${k.name}')"></span></td>
    </tr>`).join('');
}

function permChildToggle(name) {
  const n = PERM_INDEX[name];
  if (!n) return;
  n.on = n.on === false;
  renderPermDetail(PERM_INDEX[curPermName]);
}

function permOpenCreate(type) {
  document.getElementById('menuModalTitle').textContent = '新增' + type;
  document.getElementById('mType').value = type;
  document.getElementById('mName').value = '';
  document.getElementById('mAuth').value = '';
  const sel = document.getElementById('mParent');
  sel.innerHTML = Object.keys(PERM_INDEX).map((n) => `<option>${n}</option>`).join('');
  sel.value = curPermName;
  App.openModal('menuModal');
}

function menuSave() {
  const name = val('mName').trim();
  if (!name) { toast('请填写名称'); return; }
  if (PERM_INDEX[name]) { toast('节点名称已存在'); return; }
  const parent = PERM_INDEX[val('mParent')];
  if (!parent) { toast('请选择上级节点'); return; }
  if (!parent.children) parent.children = [];
  parent.children.push({ name, type: val('mType'), auth: val('mAuth').trim(), on: true });
  buildPermIndex();
  renderPermTree();
  App.closeModal('menuModal');
  toast('权限节点已创建（原型演示）');
}

function renderTree(el, node, onSelect, depth = 0) {
  const div = document.createElement('div');
  if (depth > 0) div.className = 'tree-children';
  const item = document.createElement('div');
  item.className = 'tree-node' + (node.sel ? ' sel' : '');
  const hasKids = node.children && node.children.length;
  const badge = node.type ? `<span class="badge ${node.type === '目录' ? 'b-purple' : node.type === '菜单' ? 'b-blue' : 'b-cyan'}" style="margin-left:6px;">${node.type}</span>` : '';
  const auth = node.auth ? `<span class="mono text-3" style="margin-left:8px;font-size:12px;">${node.auth}</span>` : '';
  item.innerHTML = `<span class="text-3">${hasKids ? '▾' : '·'}</span> ${node.name}${badge}${auth}`;
  item.onclick = () => { el.querySelectorAll('.tree-node').forEach(n => n.classList.remove('sel')); item.classList.add('sel'); onSelect && onSelect(node.name); };
  div.appendChild(item);
  if (hasKids) {
    const kids = document.createElement('div');
    kids.className = 'tree-children';
    node.children.forEach(c => kids.appendChild(wrapNode(c)));
    div.appendChild(kids);
  }
  el.appendChild(div);
  function wrapNode(c) {
    const holder = document.createElement('div');
    renderTree(holder, c, onSelect, 1);
    return holder;
  }
}
</script>
</body>
</html>
