<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>数据权限 · Open Ontology</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<div id="root"></div>
<script src="../assets/app.js"></script>
<script>
App.mount({
  page: 'sec-permissions',
  crumbs: ['智能制造空间', '安全管理', '数据权限'],
  title: '数据权限',
  desc: '空间内行级过滤与列级控制策略，查询与 Pipeline 执行时统一校验。',
  actions: `<button class="btn btn-primary" onclick="toast('新建数据权限策略')">+ 新建策略</button>`,
  content: `
  <div class="card">
    <div class="card-h">
      <input class="search" type="text" placeholder="搜索策略…" />
      <select><option>全部类型</option><option>行级</option><option>列级</option></select>
    </div>
    <table class="table">
      <tr><th>策略名称</th><th>范围</th><th>类型</th><th>规则</th><th>授权对象</th><th>状态</th><th class="actions-cell">操作</th></tr>
      <tr>
        <td><b>L3 数据仅质量域可见</b></td><td>quality_report 及关联属性</td>
        <td><span class="badge b-blue no-dot">行级</span></td>
        <td class="mono fs12">domain = 'QUALITY'</td>
        <td><span class="tag blue">质量工程师</span></td>
        <td><span class="badge b-green">生效中</span></td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('编辑策略')">编辑</button><button class="btn-link btn-sm btn-danger" onclick="toast('停用策略')">停用</button></td>
      </tr>
      <tr>
        <td><b>成本属性按角色可见</b></td><td>Equipment.unit_cost / yield_rate</td>
        <td><span class="badge b-purple no-dot">列级</span></td>
        <td class="fs12">控制属性权限矩阵（见<a href="../ontology/ontology-graph.html">本体图谱 → 控制属性</a>）</td>
        <td><span class="tag blue">空间管理员</span><span class="tag blue">成本分析员</span></td>
        <td><span class="badge b-green">生效中</span></td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('编辑策略')">编辑</button><button class="btn-link btn-sm btn-danger" onclick="toast('停用策略')">停用</button></td>
      </tr>
      <tr>
        <td><b>产线数据隔离</b></td><td>equipment_master</td>
        <td><span class="badge b-blue no-dot">行级</span></td>
        <td class="mono fs12">line IN (user.dept_lines)</td>
        <td><span class="tag blue">按部门动态</span></td>
        <td><span class="badge b-green">生效中</span></td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('编辑策略')">编辑</button><button class="btn-link btn-sm btn-danger" onclick="toast('停用策略')">停用</button></td>
      </tr>
      <tr>
        <td><b>行级标记列校验</b></td><td>equipment_master.marking_level</td>
        <td><span class="badge b-cyan no-dot">标记列</span></td>
        <td class="fs12">逐行校验当前用户满足该行标记列（Mandatory Control Property）</td>
        <td><span class="tag blue">全部角色</span></td>
        <td><span class="badge b-green">生效中</span></td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('编辑策略')">编辑</button><button class="btn-link btn-sm btn-danger" onclick="toast('停用策略')">停用</button></td>
      </tr>
    </table>
    <div class="pager">共 4 条<span style="flex:1"></span><span class="pg">‹</span><span class="pg cur">1</span><span class="pg">›</span></div>
  </div>

  <div class="row mt16">
    <div class="card col">
      <div class="card-h"><h3>行级标记列（Mandatory Control Property）</h3><span class="sub">对标 Palantir Object Security Policies</span></div>
      <div class="card-b">
        <div class="tip mb8 text-2">将对象类型的某一属性声明为「标记列」，查询时逐行校验当前用户是否满足该行标记（成员关系 + 密级组合），不满足则该行不可见。</div>
        <table class="table">
          <tr><th class="mono">equipment_id</th><th class="mono">name</th><th class="mono">marking_level</th><th>shawn 可见</th></tr>
          <tr><td class="mono">EQP-0012</td><td>CNC 加工中心 A12</td><td><span class="tag">L2 内部</span></td><td><span class="badge b-green no-dot">✓</span></td></tr>
          <tr><td class="mono">EQP-0045</td><td>老化测试台 T2（军品线）</td><td><span class="tag">L3 秘密</span><span class="tag">EQP-COST</span></td><td><span class="badge b-green no-dot">✓ 满足全部标记</span></td></tr>
          <tr><td class="mono">EQP-0077</td><td>出口检测设备 X1</td><td><span class="tag">L3 秘密</span><span class="tag">PII</span></td><td><span class="badge b-red no-dot">✗ 缺少 PII 成员身份</span></td></tr>
        </table>
        <div class="tip mt8">对象安全策略默认继承数据源的全部强制控制（Organization + Marking + 密级组合），物化数据按最严格原则叠加，可在策略中显式增删。</div>
      </div>
    </div>
    <div class="card col">
      <div class="card-h"><h3>策略继承与读写边界</h3></div>
      <div class="card-b">
        <table class="table">
          <tr><th>规则</th><th>说明</th></tr>
          <tr><td>继承数据源强制控制</td><td class="fs12 text-2">对象策略默认继承来源数据集的 Organization / Marking，可增不可默认删</td></tr>
          <tr><td>读取时生效</td><td class="fs12 text-2">行 / 列过滤仅在<b>读取</b>时生效，不延伸到导出与下游</td></tr>
          <tr><td>写入需标记兜底</td><td class="fs12 text-2">通过动作写回 marked 数据时，须同步配置标记，否则阻断</td></tr>
          <tr><td>禁止 NOT 条件</td><td class="fs12 text-2">不允许对组 / 标记 / 组织使用 NOT（缺属性会放大权限）</td></tr>
        </table>
      </div>
    </div>
  </div>

  <div class="card mt16">
    <div class="card-h"><h3>校验优先级说明</h3></div>
    <div class="card-b text-2 fs13">权限校验优先级：对象权限（本体图谱）&gt; 数据集权限 &gt; 字段 / 标记策略，全部通过才放行，命中即记录<a href="../audit/audit-logs.html">审计日志</a>。权限可解释性见<a href="../audit/audit-logs.html">审计日志 → Check Access</a>。</div>
  </div>`,
});
</script>
</body>
</html>
