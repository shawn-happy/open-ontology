<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>审计日志 · Open Ontology</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<div id="root"></div>
<script src="../assets/app.js"></script>
<script>
const logs = [
  ['09-09 10:42:11', '李静', '本体图谱', '编辑属性 Equipment.yield_rate（衍生属性函数变更）', '变更', '已留痕'],
  ['09-09 10:31:07', 'MES 集成 Key', '应用 API', '对象点查 Equipment EQP-0012', '查询', '通过'],
  ['09-09 10:30:41', '系统', 'Pipeline', 'pl-equipment-cdc 运行成功（1,204 行）', '运行', '成功'],
  ['09-09 10:29:55', '吴娜', '数据探查', '执行 SQL（L2 数据集 · 自动脱敏 2 字段）', '查询', '通过'],
  ['09-09 10:12:33', '张伟', '动作', '执行动作 reportEquipmentFault → 工单 WO-20260909-031', '写入', '通过'],
  ['09-09 10:05:19', 'API Key bi-report', '应用 API', '关联查询被拒：越权访问 L3 数据集', '鉴权', '<b style="color:var(--danger)">拒绝</b>'],
  ['09-09 09:58:02', 'shawn', '安全管理', '修改脱敏规则「成本数值区间化」豁免角色', '变更', '已留痕'],
  ['09-09 09:51:44', '李静', 'Checkpoint', '导出 quality_report（L3）：理由「月度质量例会材料」', '导出', '已批准'],
];

App.mount({
  page: 'audit-logs',
  crumbs: ['智能制造空间', '审计管理', '审计日志'],
  title: '审计日志',
  desc: '空间内全部操作、查询、鉴权与变更留痕，支持追溯与导出。',
  actions: `<button class="btn" onclick="toast('导出 CSV')">导出</button><button class="btn btn-primary" onclick="toast('配置审计保留策略')">保留策略</button>`,
  content: `
  <div class="stat-grid">
    <div class="stat"><div class="label">今日日志量</div><div class="val">3,842</div></div>
    <div class="stat"><div class="label">鉴权拒绝</div><div class="val" style="color:var(--danger)">12</div></div>
    <div class="stat"><div class="label">敏感操作（变更）</div><div class="val">86</div></div>
    <div class="stat"><div class="label">日志保留</div><div class="val fs13" style="font-size:18px;">180 天</div></div>
  </div>
  <div class="card">
    <div class="card-h">
      <input class="search" type="text" placeholder="搜索操作内容…" />
      <select><option>全部模块</option><option>本体图谱</option><option>数据管理</option><option>应用 API</option><option>动作</option><option>安全管理</option></select>
      <select><option>全部类型</option><option>查询</option><option>写入</option><option>变更</option><option>鉴权</option></select>
      <input type="text" style="width:230px" placeholder="时间范围 09-09 00:00 ~ now" />
    </div>
    <table class="table">
      <tr><th>时间</th><th>操作者</th><th>模块</th><th>操作内容</th><th>类型</th><th>结果</th><th class="actions-cell">操作</th></tr>
      ${logs.map(l => `
      <tr>
        <td class="mono fs12">${l[0]}</td>
        <td><b>${l[1]}</b></td>
        <td><span class="tag">${l[2]}</span></td>
        <td class="fs12">${l[3]}</td>
        <td><span class="badge b-gray no-dot">${l[4]}</span></td>
        <td>${l[5]}</td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('查看上下文与请求详情')">详情</button></td>
      </tr>`).join('')}
    </table>
    <div class="pager">共 48,210 条<span style="flex:1"></span><span class="pg">‹</span><span class="pg cur">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">…</span><span class="pg">›</span></div>
  </div>

  <div class="row mt16">
    <div class="card col">
      <div class="card-h"><h3>Checkpoint（敏感操作管控）</h3><span class="sub">对标 Palantir Checkpoints</span></div>
      <div class="card-b" style="padding-top:8px;">
        <table class="table">
          <tr><th>触发操作</th><th>操作者</th><th>理由</th><th>状态</th><th class="actions-cell">操作</th></tr>
          <tr><td class="fs12">导出 quality_report（L3）</td><td class="fs12">李静</td><td class="fs12 text-2">月度质量例会材料</td><td><span class="badge b-green no-dot">已批准</span></td><td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('查看资源引用与复核记录')">复核</button></td></tr>
          <tr><td class="fs12">批量导出 Equipment 成本字段</td><td class="fs12">API Key bi-report</td><td class="fs12 text-2">未填写（Key 不支持 Checkpoint，已阻断）</td><td><span class="badge b-red no-dot">已阻断</span></td><td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('查看阻断详情')">详情</button></td></tr>
        </table>
        <div class="tip mt8">导出等敏感操作强制提交理由；理由文本、操作者、时间与涉及资源引用一并留痕，供事后复核。</div>
      </div>
    </div>
    <div class="card col">
      <div class="card-h"><h3>Check Access（权限可解释性）</h3><div class="right"><button class="btn btn-sm btn-primary" onclick="toast('已生成访问报告')">生成报告</button></div></div>
      <div class="card-b" style="padding-top:8px;">
        <div class="form-inline mb8">
          <select style="min-width:130px"><option>用户：李静</option><option>组：质量工程师</option></select>
          <span class="text-3 fs12">对</span>
          <select style="min-width:150px"><option>对象：quality_report</option><option>对象：Equipment.unit_cost</option></select>
          <button class="btn btn-sm" onclick="toast('解释生成：3 条允许链路 · 1 条拒绝原因')">解释</button>
        </div>
        <table class="table">
          <tr><th>链路</th><th>结果</th><th>依据</th></tr>
          <tr><td class="fs12">数据集权限</td><td><span class="badge b-green no-dot">允许</span></td><td class="fs12 text-2">质量工程师组 · Editor 角色</td></tr>
          <tr><td class="fs12">标记 Member</td><td><span class="badge b-green no-dot">允许</span></td><td class="fs12 text-2">L3 秘密成员（继承自质量工程师组）</td></tr>
          <tr><td class="fs12">行级策略</td><td><span class="badge b-orange no-dot">部分</span></td><td class="fs12 text-2">domain = 'QUALITY' 过滤后可见 92%</td></tr>
          <tr><td class="fs12">导出</td><td><span class="badge b-red no-dot">拒绝</span></td><td class="fs12 text-2">L3 导出需 Checkpoint + 空间管理员审批</td></tr>
        </table>
      </div>
    </div>
  </div>

  <div class="card mt16">
    <div class="card-h"><h3>Action Log（动作留痕）</h3><span class="sub">动作日志自动链接被编辑对象，支持撤销溯源 → <a href="../ontology/ontology-actions.html">动作管理</a></span></div>
    <div class="card-b text-2 fs13">动作提交日志在「动作」页面单独维护（含被编辑对象链路与 Revert 记录）；此处汇总其提交事件流，可按动作类型 / 提交者 / 被编辑对象筛选。</div>
  </div>`,
});
</script>
</body>
</html>
