<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>审批记录 · Open Ontology</title>
<link rel="stylesheet" href="../assets/style.css" />
<style>
  .res-link { color: var(--primary); cursor: pointer; }
  .res-link:hover { text-decoration: underline; }
  .role-switch { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 6px; background: #f3f4f6; font-size: 13px; margin-bottom: 16px; }
  .role-switch b { color: var(--primary); }
  .role-switch button { font-size: 12px; padding: 2px 10px; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .role-switch button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .role-switch button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .apv-hint { font-size: 12px; color: var(--text-3); margin-left: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- 通过 / 驳回（审批意见） -->
<div class="mask" id="actModal" data-close-mask>
  <div class="modal sm">
    <div class="modal-h"><span id="actTitle">通过审批</span><span class="x" onclick="App.closeModal('actModal')">×</span></div>
    <div class="modal-b">
      <div class="fs13 mb8" id="actTarget"></div>
      <div class="form-item"><label>审批意见</label><textarea id="actComment" rows="3" placeholder="填写审批意见（可选）"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('actModal')">取消</button><button class="btn btn-primary" id="actConfirmBtn" onclick="actConfirm()">确定</button></div>
  </div>
</div>

<!-- 撤回确认 -->
<div class="mask" id="withdrawModal" data-close-mask>
  <div class="modal sm">
    <div class="modal-h"><span>撤回审批</span><span class="x" onclick="App.closeModal('withdrawModal')">×</span></div>
    <div class="modal-b">
      <div class="fs13 mb8" id="withdrawTarget"></div>
      <div class="form-item"><label>撤回原因</label><textarea id="withdrawReason" rows="3" placeholder="填写撤回原因（可选）"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('withdrawModal')">取消</button><button class="btn btn-danger" onclick="withdrawConfirm()">确认撤回</button></div>
  </div>
</div>

<!-- 审批详情抽屉 -->
<div class="drawer-mask" id="apvDrawer-mask" onclick="App.closeDrawer('apvDrawer')"></div>
<div class="drawer" id="apvDrawer">
  <div class="drawer-h">
    <h3>审批详情 · <span class="mono" id="ddId"></span></h3>
    <span id="ddStatus"></span>
    <span class="x" onclick="App.closeDrawer('apvDrawer')">×</span>
  </div>
  <div class="drawer-b" id="ddBody"></div>
  <div class="drawer-f" id="ddFoot"></div>
</div>

<script src="../assets/app.js"></script>
<script>

const NORMAL_USER   = 'wuna';    // 普通用户

    ver: 'v1（新建正则约束）', scope: '全局',
    submitter: 'lijing', submitTime: '2026-09-25 08:30',
    status: 'pending', apvUsers: ['shawn'], apvRoles: ['空间管理员'],
  },
  // ---------- 待审批（非 shawn 审批，shawn 不可操作）----------
  {

    status: 'pending', apvUsers: ['lijing'], apvRoles: [],
  },
  {

  {

  },

  {
    id: 'AP-20260924-005', res: 'function', resName: 'detectAnomaly 异常检测函数',

  },
  {
    id: 'AP-20260922-004', res: 'action', resName: 'updateUnitCost 更新单位成本',
    ver: 'v1 → v2（增加权限校验）', scope: '全局',
    submitter: 'shawn', submitTime: '2026-09-22 09:12',
    status: 'withdrawn', apvUsers: ['shawn'], apvRoles: ['空间管理员'],
    withdrawer: 'shawn', withdrawTime: '2026-09-22 10:30', withdrawReason: '需求变更，暂停发布。',
  },
];

let curTab = 'pending';
let actRecordId = null;
let actType = 'approved';
let detailId = null;
let withdrawId = null;

function resBadge(r) { const m = RES_META[r.res]; return `<span class="badge ${m.badge} no-dot">${m.label}</span>`; }
function resLink(r) { return `<a class="res-link" onclick="openDetail('${r.id}')" title="点击查看详情，物料详情在审批详情页中查看">${r.resName}</a>`; }
function stBadge(r) { return `<span class="badge ${ST[r.status].badge}">${ST[r.status].label}</span>`; }

App.mount({
  page: 'approval',
  crumbs: ['平台管理', '审批中心', '审批记录'],
  title: '审批记录',
  desc: '本体资源发布审批的单据流转记录：审批人可见待办 / 已办 / 我发起的，普通用户仅可见「我发起的」。',
  actions: `<a class="btn" href="approval-config.html">← 审批流程配置</a>`,
  content: `
  <div class="role-switch">
    <span>当前视角：</span>
    <button id="btnApprover" class="active" onclick="switchRole('approver')">审批人（shawn · 超级管理员）</button>
    <button id="btnUser" onclick="switchRole('user')">普通用户（wuna · 本体建模员）</button>
    <span class="apv-hint">切换视角以查看不同用户的审批体验</span>
  </div>
  <div id="roleTip" class="tip mb16 text-2"></div>
  <div class="card" style="border-radius:0 0 8px 8px;">
    <div class="tabs" data-group="apv" id="apvTabs">
      <div class="tab active" data-pane="pending" data-group="apv" id="tabPending">待办审批 <span class="cnt" id="cntPending"></span></div>
      <div class="tab" data-pane="done" data-group="apv" id="tabDone">已办审批 <span class="cnt" id="cntDone"></span></div>
      <div class="tab" data-pane="mine" data-group="apv" id="tabMine">我发起的 <span class="cnt" id="cntMine"></span></div>
    </div>
    <div class="tab-pane active" data-group="apv" data-pane="pending" id="panePending">
      <table class="table"><thead><tr><th>审批单号</th><th>资源类型</th><th>资源名称</th><th>变更摘要</th><th>作用域</th><th>发起人</th><th>提交时间</th><th>状态</th><th class="actions-cell">操作</th></tr></thead><tbody id="tbPending"></tbody></table>
    </div>
    <div class="tab-pane" data-group="apv" data-pane="done" id="paneDone">
      <table class="table"><thead><tr><th>审批单号</th><th>资源类型</th><th>资源名称</th><th>作用域</th><th>发起人</th><th>审批人</th><th>审批时间</th><th>状态</th><th>审批意见</th><th class="actions-cell">操作</th></tr></thead><tbody id="tbDone"></tbody></table>
    </div>
    <div class="tab-pane" data-group="apv" data-pane="mine" id="paneMine">
      <table class="table"><thead><tr><th>审批单号</th><th>资源类型</th><th>资源名称</th><th>作用域</th><th>提交时间</th><th>状态</th><th class="actions-cell">操作</th></tr></thead><tbody id="tbMine"></tbody></table>
    </div>
  </div>`,

  onMount() { switchRole('approver'); },
});

// ===== 角色切换 =====
function switchRole(role) {
  viewRole = role;
  document.getElementById('btnApprover').className = role === 'approver' ? 'active' : '';
  document.getElementById('btnUser').className = role === 'user' ? 'active' : '';

  if (role === 'approver') {
    document.getElementById('roleTip').innerHTML =
      '当前以 <b>shawn（超级管理员 · 审批人）</b> 视角查看：可见待办审批、已办审批、我发起的三个列表；待办中仅当前用户为指定审批人或匹配审批角色时，才可执行通过/驳回操作。';
    // 显示全部 Tab
    document.getElementById('tabPending').style.display = '';
    document.getElementById('tabDone').style.display = '';
    document.getElementById('tabMine').style.display = '';
    curTab = 'pending';
    activateTab('pending');
  } else {
    document.getElementById('roleTip').innerHTML =
      '当前以 <b>wuna（本体建模员 · 普通用户）</b> 视角查看：仅可见「我发起的」列表，无法看到待办/已办审批；待审批状态下可撤回申请。';
    // 隐藏审批人专属 Tab
    document.getElementById('tabPending').style.display = 'none';
    document.getElementById('tabDone').style.display = 'none';
    document.getElementById('tabMine').style.display = '';
    curTab = 'mine';
    activateTab('mine');
  }
  renderAll();
}

function activateTab(pane) {
  document.querySelectorAll('#apvTabs .tab').forEach((el) => el.classList.toggle('active', el.dataset.pane === pane));
  document.querySelectorAll('.tab-pane[data-group="apv"]').forEach((el) => el.classList.toggle('active', el.dataset.pane === pane));
}

// ===== 当前用户 =====
function currentUser() { return viewRole === 'approver' ? APPROVER_USER : NORMAL_USER; }

// ===== 判断当前用户是否为指定审批人 =====
function isApproverOf(r) {
  const u = currentUser();
  if ((r.apvUsers || []).includes(u)) return true;
  // 角色匹配简化：shawn 拥有全部角色，lijing 拥有空间管理员
  const roleMap = { shawn: ['超级管理员','空间管理员','本体建模员','数据工程师'], lijing: ['空间管理员','本体建模员'], zhangwei: ['空间管理员'], zhaomin: ['本体建模员'] };
  const uRoles = roleMap[u] || [];
  return (r.apvRoles || []).some((role) => uRoles.includes(role));
}

function renderAll() {
  renderCounts();
  renderPending(); renderDone(); renderMine();
}

function renderCounts() {
  const u = currentUser();
  document.getElementById('cntPending').textContent = RECORDS.filter((r) => r.status === 'pending' && isApproverOf(r)).length;
  document.getElementById('cntDone').textContent = RECORDS.filter((r) => r.status !== 'pending' && isApproverOf(r)).length;
  document.getElementById('cntMine').textContent = RECORDS.filter((r) => r.submitter === u).length;
}

// ===== 待办审批（仅审批人视角可见，且只显示分配给当前用户的）=====
function renderPending() {
  const tb = document.getElementById('tbPending');
  const u = currentUser();
  const list = RECORDS.filter((r) => r.status === 'pending' && isApproverOf(r));
  if (!list.length) { tb.innerHTML = '<tr><td colspan="9" class="empty">暂无待办审批</td></tr>'; return; }
  tb.innerHTML = list.map((r) => {
    const canAct = isApproverOf(r); // 当前用户可操作
    const actBtns = canAct
      ? `<button class="btn-link btn-sm" onclick="openAct('${r.id}','approved')">通过</button>
         <button class="btn-link btn-sm btn-danger" onclick="openAct('${r.id}','rejected')">驳回</button>`
      : '<span class="apv-hint">非指定审批人</span>';
    return `
    <tr>
      <td class="mono">${r.id}</td>
      <td>${resBadge(r)}</td>
      <td><b>${resLink(r)}</b></td>
      <td class="fs12 text-2">${r.ver}</td>
      <td>${r.scope === '全局' ? '<span class="badge b-purple no-dot">全局</span>' : r.scope}</td>
      <td>${r.submitter}</td>
      <td class="text-2 fs12">${r.submitTime}</td>
      <td>${stBadge(r)}</td>
      <td class="actions-cell">
        <button class="btn-link btn-sm" onclick="openDetail('${r.id}')">详情</button>
        ${actBtns}
      </td>
    </tr>`;
  }).join('');
}

// ===== 已办审批 =====
function renderDone() {
  const tb = document.getElementById('tbDone');
  const list = RECORDS.filter((r) => r.status !== 'pending' && r.status !== 'withdrawn' && isApproverOf(r));
  if (!list.length) { tb.innerHTML = '<tr><td colspan="10" class="empty">暂无已办记录</td></tr>'; return; }
  tb.innerHTML = list.map((r) => `
    <tr>
      <td class="mono">${r.id}</td>
      <td>${resBadge(r)}</td>
      <td><b>${resLink(r)}</b></td>
      <td>${r.scope === '全局' ? '<span class="badge b-purple no-dot">全局</span>' : r.scope}</td>
      <td>${r.submitter}</td>
      <td>${r.approver || '—'}</td>
      <td class="text-2 fs12">${r.doneTime || '—'}</td>
      <td>${stBadge(r)}</td>
      <td class="fs12 text-2" style="max-width:220px;">${r.comment || '—'}</td>
      <td class="actions-cell"><button class="btn-link btn-sm" onclick="openDetail('${r.id}')">详情</button></td>
    </tr>`).join('');
}

// ===== 我发起的 =====
function renderMine() {
  const tb = document.getElementById('tbMine');
  const u = currentUser();
  const list = RECORDS.filter((r) => r.submitter === u);
  if (!list.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">暂无发起记录</td></tr>'; return; }
  tb.innerHTML = list.map((r) => {
    const canWithdraw = r.status === 'pending';
    const withdrawBtn = canWithdraw ? `<button class="btn-link btn-sm btn-danger" onclick="openWithdraw('${r.id}')">撤回</button>` : '';
    const resubmitBtn = r.status === 'rejected' ? `<button class="btn-link btn-sm" onclick="toast('已重新提交（原型演示）')">重新提交</button>` : '';
    return `
    <tr>
      <td class="mono">${r.id}</td>
      <td>${resBadge(r)}</td>
      <td><b>${resLink(r)}</b></td>
      <td>${r.scope === '全局' ? '<span class="badge b-purple no-dot">全局</span>' : r.scope}</td>
      <td class="text-2 fs12">${r.submitTime}</td>
      <td>${stBadge(r)}</td>
      <td class="actions-cell">
        <button class="btn-link btn-sm" onclick="openDetail('${r.id}')">详情</button>
        ${withdrawBtn}${resubmitBtn}
      </td>
    </tr>`;
  }).join('');
}

// ===== Tab 点击 =====
document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab[data-group="apv"]');
  if (!tab) return;
  curTab = tab.dataset.pane;
  activateTab(curTab);
});

// ===== 通过 / 驳回 =====
function openAct(id, type) {
  actRecordId = id; actType = type;
  const r = RECORDS.find((x) => x.id === id);
  document.getElementById('actTitle').textContent = type === 'approved' ? '通过审批' : '驳回审批';
  document.getElementById('actTarget').innerHTML = `<b class="mono">${r.id}</b> · ${r.resName}`;
  document.getElementById('actComment').value = '';
  const btn = document.getElementById('actConfirmBtn');
  btn.textContent = type === 'approved' ? '确认通过' : '确认驳回';
  btn.className = 'btn ' + (type === 'approved' ? 'btn-primary' : 'btn-danger');
  App.openModal('actModal');
}

function actConfirm() {
  const r = RECORDS.find((x) => x.id === actRecordId);
  if (!r) return;
  const comment = document.getElementById('actComment').value.trim();
  r.status = actType;
  r.approver = currentUser();
  r.doneTime = '2026-09-25 14:30';
  r.comment = comment || (actType === 'approved' ? '同意发布。' : '不符合发布要求，请修改后重新提交。');
  App.closeModal('actModal');
  renderAll();
  App.pushNotif(actType, actType === 'approved'
    ? `您通过了 ${r.submitter} 发起的${RES_META[r.res].label}「${r.resName}」发布审批（${r.id}）`
    : `您驳回了 ${r.submitter} 发起的${RES_META[r.res].label}「${r.resName}」发布申请（${r.id}）`);
  toast(`审批完成：${ST[actType].label} · ${r.id}`);
  if (detailId === r.id) openDetail(r.id);
}

// ===== 撤回 =====
function openWithdraw(id) {
  withdrawId = id;
  const r = RECORDS.find((x) => x.id === id);
  document.getElementById('withdrawTarget').innerHTML = `<b class="mono">${r.id}</b> · ${r.resName}<br><span class="fs12 text-2">撤回后审批单将关闭，如需发布请重新提交。</span>`;
  document.getElementById('withdrawReason').value = '';
  App.openModal('withdrawModal');
}

function withdrawConfirm() {
  const r = RECORDS.find((x) => x.id === withdrawId);
  if (!r) return;
  const reason = document.getElementById('withdrawReason').value.trim();
  r.status = 'withdrawn';
  r.withdrawer = currentUser();
  r.withdrawTime = '2026-09-25 14:30';
  r.withdrawReason = reason || '发起人主动撤回。';
  App.closeModal('withdrawModal');
  renderAll();
  toast(`已撤回：${r.id}`);
  if (detailId === r.id) openDetail(r.id);
}

// ===== 审批详情抽屉 =====
function openDetail(id) {
  const r = RECORDS.find((x) => x.id === id);
  if (!r) return;
  detailId = id;
  const m = RES_META[r.res];
  const u = currentUser();

  document.getElementById('ddId').textContent = r.id;
  document.getElementById('ddStatus').innerHTML = stBadge(r);

  const apvTags =
    (r.apvUsers || []).map((a) => `<span class="tag blue">用户 · ${a}</span>`).join('') +
    (r.apvRoles || []).map((x) => `<span class="tag role">角色 · ${x}（成员动态计算）</span>`).join('');

  // 审批流程时间线
  let flow = `<div class="tl-item"><div class="tl-time">${r.submitTime}</div><div class="tl-title">${r.submitter} 提交发布申请</div><div class="tl-desc">${r.ver}</div></div>`;

  if (r.status === 'pending') {
    flow += `<div class="tl-item warn"><div class="tl-time">—</div><div class="tl-title">等待审批</div><div class="tl-desc">审批人：${apvTags}</div></div>`;
  } else if (r.status === 'withdrawn') {
    flow += `<div class="tl-item err"><div class="tl-time">${r.withdrawTime}</div><div class="tl-title">${r.withdrawer} 撤回了申请</div><div class="tl-desc">${r.withdrawReason || ''}</div></div>`;
  } else {
    const cls = r.status === 'rejected' ? 'err' : '';
    flow += `<div class="tl-item ${cls}"><div class="tl-time">${r.doneTime}</div><div class="tl-title">${r.approver} ${ST[r.status].label}</div><div class="tl-desc">${r.comment || ''}</div></div>`;
  }

  document.getElementById('ddBody').innerHTML = `
    <dl class="desc-list mb16">
      <dt>资源类型</dt><dd>${resBadge(r)}</dd>
      <dt>资源名称</dt><dd><b>${r.resName}</b></dd>
      <dt>变更摘要</dt><dd class="fs13">${r.ver}</dd>
      <dt>作用范围</dt><dd>${r.scope === '全局' ? '全局（平台级，全部空间生效）' : r.scope + '（仅该工作空间生效）'}</dd>
      <dt>发起人</dt><dd>${r.submitter}</dd>
      <dt>提交时间</dt><dd>${r.submitTime}</dd>
      <dt>审批人</dt><dd><span class="apv-tags">${apvTags || '—'}</span></dd>
    </dl>
    <div class="fs13 bold mb8">审批流程</div>
    <div class="timeline">${flow}</div>`;

  // 底部按钮：根据角色和状态动态生成
  const isPending = r.status === 'pending';
  const canApprove = isPending && isApproverOf(r) && viewRole === 'approver';
  const canWithdraw = isPending && r.submitter === u;

  let footBtns = `<a class="btn" href="${m.href}" title="查看该资源的物料详情页">查看物料详情 →</a>
    <button class="btn" onclick="App.closeDrawer('apvDrawer')">关闭</button>`;
  if (canApprove) {
    footBtns = `<button class="btn btn-danger" onclick="App.closeDrawer('apvDrawer');openAct('${r.id}','rejected')">驳回</button>
    <button class="btn btn-primary" onclick="App.closeDrawer('apvDrawer');openAct('${r.id}','approved')">通过</button>` + footBtns;
  }
  if (canWithdraw) {
    footBtns = `<button class="btn btn-danger" onclick="App.closeDrawer('apvDrawer');openWithdraw('${r.id}')">撤回申请</button>` + footBtns;
  }
  document.getElementById('ddFoot').innerHTML = footBtns;
  App.openDrawer('apvDrawer');
}
</script>
</body>
</html>
