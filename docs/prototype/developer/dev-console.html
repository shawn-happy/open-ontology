<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Developer Console · Open Ontology</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<div id="root"></div>

<!-- 注册应用 -->
<div class="mask" id="appModal" data-close-mask>
  <div class="modal">
    <div class="modal-h">注册应用（Developer Console）<span class="x" onclick="App.closeModal('appModal')">×</span></div>
    <div class="modal-b">
      <div class="form-row">
        <div class="form-item"><label><span class="req">*</span>应用名称</label><input type="text" placeholder="如：MES 集成网关" /></div>
        <div class="form-item"><label><span class="req">*</span>Client ID</label><input type="text" class="mono" value="mes-gateway（自动生成）" readonly /></div>
      </div>
      <div class="form-item"><label>授权方式</label>
        <select><option>OAuth Authorization Code（代表用户操作）</option><option>OAuth Client Credentials（应用身份）</option><option>Scoped Token（长生命周期）</option></select>
        <div class="tip">对标 Palantir：令牌 = 应用授权范围 × 当前用户权限 双重控制，任一不满足即拒绝。</div>
      </div>
      <div class="form-item"><label>回调地址</label><input type="text" class="mono" placeholder="https://mes.example.com/callback" /></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="App.closeModal('appModal')">取消</button><button class="btn btn-primary" onclick="App.closeModal('appModal');toast('应用已注册，请完成资源授权')">确定</button></div>
  </div>
</div>

<script src="../assets/app.js"></script>
<script>
App.mount({
  page: 'dev-console',
  crumbs: ['智能制造空间', '开发者平台', 'Developer Console'],
  title: 'Developer Console',
  desc: '注册外部应用并授权本体资源子集（对象 / 动作 / 函数类型），签发 OAuth 客户端凭据（对标 Palantir Developer Console）。',
  actions: `<button class="btn btn-primary" onclick="App.openModal('appModal')">+ 注册应用</button>`,
  content: `
  <div class="card">
    <div class="card-h">
      <input class="search" type="text" placeholder="搜索应用…" />
      <select><option>全部状态</option><option>已启用</option><option>已停用</option></select>
    </div>
    <table class="table">
      <tr><th>应用</th><th>Client ID</th><th>授权方式</th><th>授权资源</th><th>状态</th><th>今日调用</th><th class="actions-cell">操作</th></tr>
      <tr>
        <td><b>MES 集成网关</b></td><td class="mono fs12">mes-gateway</td><td class="fs12">Client Credentials</td>
        <td class="fs12"><span class="tag mono">Equipment</span><span class="tag mono">WorkOrder</span><span class="tag mono">changeRunStatus</span></td>
        <td><span class="badge b-green">已启用</span></td><td class="mono fs12">16,204</td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('打开资源授权面板')">授权</button><button class="btn-link btn-sm" onclick="toast('密钥已轮换，仅明文展示一次')">轮换密钥</button><button class="btn-link btn-sm btn-danger" onclick="toast('已停用应用')">停用</button></td>
      </tr>
      <tr>
        <td><b>BI 报表平台</b></td><td class="mono fs12">bi-report</td><td class="fs12">Authorization Code</td>
        <td class="fs12"><span class="tag mono">QualityReport</span><span class="tag mono">Equipment（只读）</span></td>
        <td><span class="badge b-green">已启用</span></td><td class="mono fs12">3,842</td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('打开资源授权面板')">授权</button><button class="btn-link btn-sm" onclick="toast('密钥已轮换')">轮换密钥</button><button class="btn-link btn-sm btn-danger" onclick="toast('已停用应用')">停用</button></td>
      </tr>
      <tr>
        <td><b>移动点检 App</b></td><td class="mono fs12">mobile-patrol</td><td class="fs12">Scoped Token（90 天）</td>
        <td class="fs12"><span class="tag mono">Equipment</span><span class="tag mono">reportEquipmentFault</span><span class="tag mono">calcEquipmentYield</span></td>
        <td><span class="badge b-orange">待授权</span></td><td class="mono fs12">—</td>
        <td class="actions-cell"><button class="btn-link btn-sm" onclick="toast('打开资源授权面板')">授权</button><button class="btn-link btn-sm btn-danger" onclick="toast('已删除应用')">删除</button></td>
      </tr>
    </table>
    <div class="pager">共 3 个应用<span style="flex:1"></span><span class="pg">‹</span><span class="pg cur">1</span><span class="pg">›</span></div>
  </div>

  <div class="row mt16">
    <div class="card col">
      <div class="card-h"><h3>资源授权 · <span class="mono">mes-gateway</span></h3><span class="sub">仅可勾选授权的类型子集</span></div>
      <div class="card-b">
        <table class="table">
          <tr><th>资源类型</th><th>候选</th><th>已授权</th></tr>
          <tr><td>对象类型</td><td class="fs12 text-2">Equipment / Process / Material / QualityReport / WorkOrder …</td><td class="fs12"><span class="tag mono">Equipment</span><span class="tag mono">WorkOrder</span></td></tr>
          <tr><td>动作类型</td><td class="fs12 text-2">changeRunStatus / reportEquipmentFault / updateUnitCost …</td><td class="fs12"><span class="tag mono">changeRunStatus</span></td></tr>
          <tr><td>函数 / Query</td><td class="fs12 text-2">calcEquipmentYield / queryFaultGraph …</td><td class="fs12 text-2">—</td></tr>
        </table>
        <div class="tip mt8">未授权资源对 SDK / API 完全不可见（不返回元数据）；动作调用仍受 Submission Criteria 与行级标记校验。</div>
      </div>
    </div>
    <div class="card col">
      <div class="card-h"><h3>鉴权模型</h3><span class="sub">双重控制</span></div>
      <div class="card-b">
        <div class="code-editor"><span class="cm"># 应用授权范围 × 用户权限，双重校验</span>
POST /api/v2/ontologies/mfg/objects/Equipment/search
Authorization: Bearer &lt;ACCESS_TOKEN&gt;

<span class="cm"># Token Claims（应用侧）</span>
<span class="kw">client_id</span>: mes-gateway
<span class="kw">resources</span>: [Equipment, WorkOrder, changeRunStatus]
<span class="kw">scope</span>: ontology:read ontology:action:execute

<span class="cm"># 生效数据仍受当前用户标记 / 行列级策略约束</span>
<span class="kw">subject</span>: svc-mes（映射平台用户）</div>
        <div class="tip mt8">行 / 列级过滤在<b>读取时</b>生效；应用密钥支持轮换、吊销与 IP 白名单（配合 <a href="../application/app-apikeys.html">API Key</a>）。</div>
      </div>
    </div>
  </div>`,
});
</script>
</body>
</html>
